---
# AWS deploy command (from repo root):
#   ansible-playbook -i inventory.ini ansible/playbook.yml --vault-password-file .vault_pass
# Vagrant deploy (if needed):
#   ansible-playbook -i local-deploy/inventory.ini ansible/playbook.yml --vault-password-file .vault_pass -e "frontend_http_port=8080"
# Single tier:
#   ... --limit storage | --limit backend | --limit frontend

- name: Configure storage tier
  hosts: storage
  become: true
  vars_files:
    - vault.yml
  roles:
    - storage

- name: Deploy backend tier
  hosts: backend
  become: true
  vars_files:
    - vault.yml
  roles:
    - backend

- name: Deploy frontend tier
  hosts: frontend
  become: true
  vars_files:
    - vault.yml
  roles:
    - frontend

# Play 4 runs after backend so that Alembic (play 2) has already created the
# users table. Admin seeding lives in the storage role (tasks/seed_admin.yml)
# and is idempotent via ON CONFLICT DO NOTHING.
- name: Seed initial storage data
  hosts: storage
  become: true
  gather_facts: false
  vars_files:
    - vault.yml
  tasks:
    - name: Wait for storage SSH to recover
      wait_for_connection:
        timeout: 60
    - name: Gather facts
      setup:
    - name: Seed admin user
      include_role:
        name: storage
        tasks_from: seed_admin.yml
    - name: Seed wordle words
      include_role:
        name: storage
        tasks_from: seed_wordle.yml
