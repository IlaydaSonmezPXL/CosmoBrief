---
- name: Install nginx and SELinux management library
  dnf:
    name:
      - nginx
      - python3-libsemanage
    state: present

# Stock generic/alma9 ships an old openssh built against an earlier OpenSSL
# ABI. Any dnf transaction that pulls a newer openssl-libs causes sshd to
# crash with "OpenSSL version mismatch". Force openssh to current to stay
# in sync with whatever openssl-libs is now installed.
- name: Keep openssh in sync with current openssl-libs
  dnf:
    name:
      - openssh
      - openssh-server
    state: latest
  notify: Restart sshd

# Build runs on the Ansible control host (delegate_to: localhost).
# Node.js must be installed locally. npm ci and npm run build have no
# Ansible module equivalents — command module is justified per PROJECT_README.md.
- name: Template .env.production for Vite build
  template:
    src: env.production.j2
    dest: "{{ playbook_dir }}/../frontend/.env.production"
  delegate_to: localhost
  become: false

- name: Install frontend npm dependencies
  command: npm ci
  args:
    chdir: "{{ playbook_dir }}/../frontend"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Build frontend static assets
  command: npm run build
  args:
    chdir: "{{ playbook_dir }}/../frontend"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Ensure web root directory exists
  file:
    path: "{{ web_root }}"
    state: directory
    owner: nginx
    group: nginx
    mode: "0755"

- name: Deploy frontend static files to VM
  copy:
    src: "{{ playbook_dir }}/../frontend/dist/"
    dest: "{{ web_root }}/"
    owner: nginx
    group: nginx
    mode: "0644"
    directory_mode: "0755"
  notify: Restart nginx

- name: Deploy nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

# Without this SELinux boolean, nginx returns 502 Bad Gateway on proxy requests.
# httpd_t domain (nginx) cannot connect to arbitrary TCP ports by default.
- name: Allow nginx to connect to upstream backend (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: yes
    persistent: yes

- name: Open HTTP port in firewalld
  ansible.posix.firewalld:
    port: "{{ frontend_http_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

- name: Enable and start nginx
  systemd:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: true

# ── EXTRA3: rsyslog forwarding to central storage receiver ───────────────────
- name: Deploy rsyslog client forwarding configuration
  template:
    src: rsyslog-client.conf.j2
    dest: /etc/rsyslog.d/10-cosmobrief-forward.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Enable and start rsyslog
  systemd:
    name: rsyslog
    state: started
    enabled: true
