---
- name: Reload nginx
  systemd:
    name: "{{ nginx_service_name }}"
    state: reloaded

- name: Restart nginx
  systemd:
    name: "{{ nginx_service_name }}"
    state: restarted

- name: Restart rsyslog
  systemd:
    name: rsyslog
    state: restarted

- name: Restart sshd
  systemd:
    name: sshd
    state: restarted
