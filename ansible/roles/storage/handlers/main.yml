---
- name: Restart PostgreSQL
  systemd:
    name: "{{ pg_service_name }}"
    state: restarted

- name: Reload PostgreSQL
  systemd:
    name: "{{ pg_service_name }}"
    state: reloaded

- name: Restart rsyslog
  systemd:
    name: rsyslog
    state: restarted

- name: Restart sshd
  systemd:
    name: sshd
    state: restarted
