<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmo Brief — Editorial system</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editorial-shared.css">
<link rel="stylesheet" href="screens/login.css">
<link rel="stylesheet" href="screens/browse.css">
<link rel="stylesheet" href="screens/reading-map.css">
<link rel="stylesheet" href="screens/cipher.css">
<link rel="stylesheet" href="screens/admin.css">
<style>
  html, body, #root { margin: 0; height: 100%; background: #0a0a0f; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="editorial-chrome.jsx"></script>
<script type="text/babel" src="screens/login.jsx"></script>
<script type="text/babel" src="screens/browse.jsx"></script>
<script type="text/babel" src="screens/reading-map.jsx"></script>
<script type="text/babel" src="screens/cipher.jsx"></script>
<script type="text/babel" src="screens/admin.jsx"></script>
<script type="text/babel" data-presets="react">
function App() {
  return (
    <DesignCanvas
      title="Cosmo&Brief — Editorial system"
      subtitle="Login · Browse · Reading Map · Daily Cipher · Newsroom — every screen aligned to the editorial home page."
    >
      <DCSection id="auth" title="Subscriber entrance">
        <DCArtboard id="login" label="Login — split editorial hero + form" width={1440} height={1000}>
          <LoginPage />
        </DCArtboard>
      </DCSection>

      <DCSection id="reader" title="Reading surfaces">
        <DCArtboard id="browse" label="Browse — the archive (filters, search, dense list)" width={1440} height={1700}>
          <BrowsePage />
        </DCArtboard>
        <DCArtboard id="map" label="Reading Map — constellation + AI reflection" width={1440} height={1500}>
          <ReadingMapPage />
        </DCArtboard>
        <DCArtboard id="cipher" label="Daily Cipher — full puzzle page" width={1440} height={1400}>
          <CipherPage />
        </DCArtboard>
      </DCSection>

      <DCSection id="staff" title="Staff entrance">
        <DCArtboard id="admin" label="Newsroom — Editor's Desk (tokens, subscribers, queue)" width={1440} height={2000}>
          <AdminPage />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
