<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmo Brief — The Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root {
  --ink: #0a0a0f;
  --ink-soft: #1a1a22;
  --paper: #f4ede0;
  --paper-warm: #ebe1d0;
  --paper-dim: #d8ccb4;
  --rule: #2a2730;
  --rule-soft: rgba(244,237,224,0.14);
  --accent: #e8542c;       /* signature warm coral */
  --accent-deep: #b83c1a;
  --gold: #d4a64a;
  --cyan: #4ec5cf;
  --plum: #8a6dbf;
  --mute: #8a8378;
  --serif: 'Fraunces', 'Times New Roman', serif;
  --sans: 'Space Grotesk', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--ink); color: var(--paper); font-family: var(--sans); }
html { scroll-behavior: smooth; }
body { min-height: 100vh; }
section[id] { scroll-margin-top: 72px; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* === Top masthead === */
.masthead {
  background: var(--paper);
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
  padding: 0.55rem 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.masthead .left { display: flex; gap: 1.2rem; }
.masthead .right { display: flex; gap: 1.2rem; align-items: center; }
.weather-pill { display: flex; align-items: center; gap: 0.4rem; }
.weather-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* === Brand bar === */
.brand-bar {
  background: var(--paper);
  color: var(--ink);
  padding: 1.6rem 2.5rem 1.4rem;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 2rem;
  border-bottom: 1px solid var(--ink);
}
.brand-meta { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
.brand-meta .row { display: flex; gap: 0.6rem; align-items: center; }
.brand-meta .row + .row { margin-top: 0.35rem; color: #6b6358; }
.brand {
  font-family: var(--serif);
  font-weight: 900;
  font-size: 5.2rem;
  line-height: 0.9;
  letter-spacing: -0.04em;
  text-align: center;
  font-variation-settings: "opsz" 144, "SOFT" 0;
  font-style: italic;
}
.brand .amp {
  display: inline-block;
  margin: 0 -0.04em;
  color: var(--accent);
  font-style: italic;
}
.brand-actions { display: flex; gap: 0.6rem; justify-content: flex-end; align-items: center; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
.brand-actions .chip { padding: 0.4rem 0.7rem; border: 1px solid var(--ink); border-radius: 999px; cursor: pointer; transition: all 0.12s; }
.brand-actions .chip:hover { background: var(--ink); color: var(--paper); }
.brand-actions .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 0.95rem; }

/* === Section nav (sticky) === */
.section-nav {
  background: var(--ink);
  color: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding: 0.7rem 2.5rem;
  display: flex;
  gap: 1.7rem;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  position: sticky;
  top: 0;
  z-index: 50;
}
.section-nav a { color: var(--paper-dim); cursor: pointer; transition: color 0.12s; padding: 0.2rem 0; border-bottom: 1px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font: inherit; letter-spacing: inherit; text-transform: inherit; }
.section-nav a:hover, .section-nav a.active { color: var(--paper); border-bottom-color: var(--accent); }
.section-nav .spacer { flex: 1; }
.section-nav .live { display: flex; align-items: center; gap: 0.45rem; color: var(--paper); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

/* === Hero === */
.hero {
  position: relative;
  height: 78vh;
  min-height: 620px;
  overflow: hidden;
  border-bottom: 1px solid var(--rule);
}
.hero-img { position: absolute; inset: 0; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; }
.hero-img::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,10,15,0.5) 0%, rgba(10,10,15,0.15) 35%, rgba(10,10,15,0.55) 75%, rgba(10,10,15,0.95) 100%);
}
.hero-grain {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.07), transparent),
    radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.06), transparent),
    radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.05), transparent);
  pointer-events: none;
  mix-blend-mode: overlay;
}
.hero-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr;
  align-content: end;
  padding: 0 2.5rem 3.2rem;
}
.hero-kicker {
  font-family: var(--mono);
  font-size: 0.74rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 1.2rem;
  display: flex;
  gap: 0.7rem;
  align-items: center;
}
.hero-kicker .sep { width: 28px; height: 1px; background: var(--accent); display: inline-block; }
.hero-headline {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(2.6rem, 5.5vw, 5.4rem);
  line-height: 0.96;
  letter-spacing: -0.025em;
  max-width: 18ch;
  text-wrap: balance;
  margin-bottom: 1.1rem;
}
.hero-headline em { font-style: italic; color: var(--gold); font-weight: 500; }
.hero-deck {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.3rem;
  font-weight: 400;
  color: var(--paper-dim);
  max-width: 56ch;
  line-height: 1.5;
  margin-bottom: 1.4rem;
}
.hero-meta {
  display: flex;
  gap: 1.3rem;
  align-items: center;
  font-family: var(--mono);
  font-size: 0.74rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
.hero-meta .read-more {
  color: var(--paper);
  border-bottom: 1px solid var(--accent);
  padding-bottom: 2px;
  cursor: pointer;
  transition: color 0.12s;
}
.hero-meta .read-more:hover { color: var(--accent); }
.hero-meta strong { color: var(--paper); font-weight: 600; }

/* hero side ticker */
.hero-side {
  position: absolute;
  top: 50%;
  right: 2.5rem;
  transform: translateY(-50%);
  z-index: 3;
  width: 240px;
  background: rgba(10,10,15,0.55);
  backdrop-filter: blur(14px);
  border: 1px solid var(--rule-soft);
  border-radius: 4px;
  padding: 1rem 1.1rem;
}
.hero-side .label {
  font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.16em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 0.5rem; display: flex; gap: 0.4rem; align-items: center;
}
.hero-side .label::before { content:''; width:5px; height:5px; border-radius:50%; background: var(--gold); }
.hero-side .what {
  font-family: var(--serif); font-size: 1.1rem; line-height: 1.25; margin-bottom: 0.4rem; font-weight: 500;
}
.hero-side .when { font-family: var(--mono); font-size: 0.72rem; color: var(--paper-dim); }
.hero-side .compass {
  margin-top: 0.7rem;
  border-top: 1px solid var(--rule-soft);
  padding-top: 0.7rem;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 0.7rem; color: var(--paper-dim);
}
.hero-side .compass strong { color: var(--paper); }
.hero-side .compass .arrow {
  width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--paper-dim);
  display: flex; align-items: center; justify-content: center; color: var(--accent);
  font-size: 0.85rem;
}

/* === Section heading === */
.section {
  padding: 4.5rem 2.5rem 4.5rem;
  border-bottom: 1px solid var(--rule);
}
.section-head {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: end;
  margin-bottom: 2.5rem;
  gap: 2rem;
}
.section-num {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.18em;
  color: var(--mute);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  display: flex; gap: 0.6rem; align-items: center;
}
.section-num::before { content:''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.section-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(2rem, 3.3vw, 2.9rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  max-width: 22ch;
}
.section-title em { font-style: italic; color: var(--gold); font-weight: 400; }
.section-meta {
  font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.06em; color: var(--mute);
  text-transform: uppercase;
  text-align: right;
  white-space: nowrap;
  min-width: 180px;
}
.section-meta .pri { color: var(--paper); display: block; font-size: 0.85rem; margin-bottom: 0.45rem; white-space: nowrap; }

/* === Tonight strip === */
.sky-strip {
  display: grid;
  grid-template-columns: 1.2fr repeat(3, 1fr);
  gap: 1.4rem;
  margin-top: 0;
}
.sky-card {
  background: var(--ink-soft);
  border: 1px solid var(--rule);
  padding: 1.4rem 1.4rem 1.6rem;
  position: relative;
  display: flex; flex-direction: column;
  min-height: 280px;
  transition: transform 0.18s, border-color 0.18s;
  cursor: pointer;
}
.sky-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.sky-card .glyph {
  font-family: var(--serif); font-style: italic;
  font-size: 4.2rem; line-height: 1; color: var(--accent);
  margin-bottom: 0.4rem; font-weight: 500;
}
.sky-card.featured { background: var(--accent); color: var(--ink); border-color: var(--accent); grid-row: span 1; }
.sky-card.featured .glyph { color: var(--ink); font-size: 5rem; }
.sky-card .type { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); margin-bottom: 0.5rem; }
.sky-card.featured .type { color: rgba(10,10,15,0.65); }
.sky-card .name { font-family: var(--serif); font-size: 1.45rem; line-height: 1.15; font-weight: 500; margin-bottom: 0.5rem; letter-spacing: -0.01em; }
.sky-card.featured .name { font-size: 1.85rem; }
.sky-card .when { font-family: var(--mono); font-size: 0.74rem; color: var(--paper-dim); margin-bottom: 0.3rem; }
.sky-card.featured .when { color: rgba(10,10,15,0.7); }
.sky-card .where {
  margin-top: auto; padding-top: 0.8rem;
  border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 0.72rem; color: var(--paper-dim);
}
.sky-card.featured .where { border-top-color: rgba(10,10,15,0.2); color: rgba(10,10,15,0.7); }
.sky-card .where strong { color: var(--paper); font-weight: 500; font-size: 0.85rem; }
.sky-card.featured .where strong { color: var(--ink); }

/* === Featured 2-up === */
.feature-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 2rem;
}
.feature {
  display: flex; flex-direction: column;
  background: transparent;
  cursor: pointer;
}
.feature .img {
  position: relative; overflow: hidden;
  margin-bottom: 1.3rem;
  aspect-ratio: 16 / 10;
}
.feature.tall .img { aspect-ratio: 4 / 5; }
.feature .img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
.feature:hover .img img { transform: scale(1.04); }
.feature .img::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(10,10,15,0.4) 100%);
  pointer-events: none;
}
.feature .kicker {
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 0.55rem;
}
.feature .head {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(1.5rem, 2.4vw, 2.1rem); line-height: 1.05; letter-spacing: -0.015em;
  margin-bottom: 0.7rem;
  text-wrap: balance;
}
.feature.tall .head { font-size: clamp(1.6rem, 2.6vw, 2.3rem); }
.feature .deck {
  font-family: var(--sans); font-size: 0.95rem; line-height: 1.55;
  color: var(--paper-dim); margin-bottom: 0.85rem;
  max-width: 48ch;
}
.feature .meta {
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--mute);
  display: flex; gap: 0.7rem; align-items: center;
}
.feature .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--mute); }

/* === Wire (compact list) === */
.wire-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 2.5rem;
}
.wire-item {
  display: grid;
  grid-template-columns: 100px 1fr auto;
  gap: 1.2rem;
  padding: 1.4rem 0;
  border-bottom: 1px solid var(--rule);
  align-items: start;
  cursor: pointer;
  transition: padding 0.18s;
}
.wire-item:hover { padding-left: 0.5rem; }
.wire-item:hover .wire-head { color: var(--accent); }
.wire-thumb {
  width: 100px; height: 70px; overflow: hidden;
  background: var(--ink-soft);
  position: relative;
}
.wire-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.92; }
.wire-thumb.placeholder {
  display: flex; align-items: center; justify-content: center;
  color: var(--mute); font-family: var(--serif); font-style: italic; font-size: 1.4rem;
}
.wire-body { display: flex; flex-direction: column; gap: 0.35rem; }
.wire-kicker { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); display: flex; gap: 0.5rem; align-items: center; }
.wire-kicker .topic { color: var(--gold); }
.wire-kicker .topic.fresh { color: var(--accent); }
.wire-kicker .topic.aging { color: var(--gold); }
.wire-kicker .topic.archived { color: var(--mute); }
.wire-head {
  font-family: var(--serif); font-weight: 500;
  font-size: 1.1rem; line-height: 1.2;
  letter-spacing: -0.01em;
  transition: color 0.12s;
}
.wire-deck { font-size: 0.85rem; color: var(--paper-dim); line-height: 1.5; max-width: 50ch; }
.wire-time {
  font-family: var(--mono); font-size: 0.68rem; color: var(--mute);
  white-space: nowrap; padding-top: 0.2rem;
}

/* === Orbit === */
.orbit-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
.orbit-svg-wrap { display: flex; justify-content: center; }
.orbit-side { display: flex; flex-direction: column; gap: 1.2rem; }
.orbit-row {
  display: grid;
  grid-template-columns: 30px 1fr auto auto;
  gap: 1rem;
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--rule);
  align-items: center;
  cursor: pointer;
  transition: padding 0.15s;
}
.orbit-row:hover { padding-left: 0.4rem; }
.orbit-row .swatch { width: 14px; height: 14px; border-radius: 50%; }
.orbit-row .name { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; }
.orbit-row .count { font-family: var(--mono); font-size: 0.78rem; color: var(--paper-dim); }
.orbit-row .trend { font-family: var(--mono); font-size: 0.72rem; padding: 0.2rem 0.55rem; border-radius: 999px; }
.orbit-row .trend.up { color: var(--accent); border: 1px solid rgba(232,84,44,0.4); }
.orbit-row .trend.flat { color: var(--mute); border: 1px solid var(--rule); }
.orbit-row .trend.down { color: var(--gold); border: 1px solid rgba(212,166,74,0.4); }

/* === Footer === */
.foot {
  background: var(--paper);
  color: var(--ink);
  padding: 3rem 2.5rem 1.5rem;
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 2.5rem;
  border-top: 1px solid var(--ink);
}
.foot .col h4 {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
  margin-bottom: 0.9rem; color: #6b6358;
}
.foot .col ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
.foot .col a { font-family: var(--serif); font-size: 1rem; color: var(--ink); cursor: pointer; }
.foot .col a:hover { font-style: italic; color: var(--accent); }
.foot .brand-foot { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: 2.6rem; line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 0.6rem; }
.foot .brand-foot .amp { color: var(--accent); }
.foot .tagline { font-family: var(--serif); font-style: italic; font-size: 1.05rem; max-width: 28ch; line-height: 1.4; color: #4a4337; }
.foot-bar {
  grid-column: 1 / -1;
  margin-top: 2rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--ink);
  display: flex; justify-content: space-between;
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: #6b6358;
}

/* === Wordle quiet card === */
.wordle-promo {
  background: var(--ink-soft);
  border: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 3rem;
  padding: 2.5rem;
}
.wordle-promo .copy h3 { font-family: var(--serif); font-weight: 500; font-size: 2.2rem; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 0.7rem; }
.wordle-promo .copy h3 em { font-style: italic; color: var(--accent); }
.wordle-promo .copy p { color: var(--paper-dim); line-height: 1.55; max-width: 38ch; margin-bottom: 1.2rem; }
.wordle-promo .copy .stats { display: flex; gap: 2rem; font-family: var(--mono); font-size: 0.78rem; color: var(--paper-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.wordle-promo .copy .stats strong { display: block; font-family: var(--serif); font-size: 1.6rem; color: var(--paper); font-style: italic; font-weight: 500; }
.wordle-promo .play-btn {
  display: inline-flex; align-items: center; gap: 0.6rem;
  margin-top: 1.5rem;
  padding: 0.8rem 1.4rem;
  background: var(--accent); color: var(--ink);
  border: none; border-radius: 999px;
  font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
  font-weight: 500; cursor: pointer;
  transition: transform 0.12s;
}
.wordle-promo .play-btn:hover { transform: translateX(3px); }
.wordle-board-mini { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.wordle-row-mini { display: flex; gap: 6px; }
.w-mini {
  width: 46px; height: 46px;
  border: 1.5px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-style: italic; font-weight: 600;
  font-size: 1.4rem; text-transform: uppercase;
}
.w-mini.correct { background: var(--accent); color: var(--ink); border-color: var(--accent); }
.w-mini.present { background: rgba(212,166,74,0.18); color: var(--gold); border-color: var(--gold); }
.w-mini.absent { background: var(--ink); color: var(--mute); }

/* === Pull quote === */
.pullquote {
  padding: 5rem 2.5rem;
  border-bottom: 1px solid var(--rule);
  text-align: center;
}
.pullquote .mark {
  font-family: var(--serif); font-style: italic;
  font-size: 6rem; line-height: 0.5;
  color: var(--accent); margin-bottom: 1.5rem;
}
.pullquote blockquote {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(1.6rem, 2.6vw, 2.3rem);
  line-height: 1.25; letter-spacing: -0.015em;
  max-width: 26ch;
  margin: 0 auto 1.2rem;
  text-wrap: balance;
}
.pullquote blockquote em { font-style: italic; color: var(--gold); }
.pullquote .attr {
  font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--mute);
}

/* Responsive guard */
@media (max-width: 980px) {
  .sky-strip { grid-template-columns: 1fr 1fr; }
  .feature-grid, .orbit-wrap, .wordle-promo, .wire-grid { grid-template-columns: 1fr; }
  .brand { font-size: 3.5rem; }
  .hero-side { display: none; }
  .foot { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const ARTICLES = [
  { id: 1, title: "JWST Catches a Galactic Cluster Feeding the Cosmic Web", site: "Spaceflight Now", date: "Apr 28", state: "new", freshness: "fresh", topic: "Deep Sky", img: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1400&q=80&auto=format", deck: "The cluster's intracluster medium is leaking filaments into surrounding voids — direct evidence the web feeds itself.", time: "2h ago" },
  { id: 2, title: "Starship's Sixth Flight: Re-entry Burn at Mach 22", site: "NASA Spaceflight", date: "Apr 26", state: "read", freshness: "fresh", topic: "Rockets", img: "https://images.unsplash.com/photo-1457364887197-9150188c107b?w=1400&q=80&auto=format", deck: "Plasma blackout from T+47 to T+52. Telemetry returned clean. Tile mass loss under spec across the windward face.", time: "4h ago" },
  { id: 3, title: "Europa Clipper Arrives at Jupiter, Begins Plume Survey", site: "Sky & Telescope", date: "Apr 22", state: "new", freshness: "aging", topic: "Planetary", img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=1400&q=80&auto=format", deck: "Nine instruments lock onto the icy moon — first pass finds a faint vapor signal at 200 km altitude.", time: "3d ago" },
  { id: 4, title: "ISS Crew Rotation Sets Record for Continuous Habitation", site: "Spaceflight Now", date: "Apr 20", state: "read", freshness: "aging", topic: "ISS", img: null, deck: "Twenty-five years of constant human presence. The next handover ships up in June.", time: "5d ago" },
  { id: 5, title: "Lunar Gateway's First Module Powers Up in Cislunar Orbit", site: "Ars Technica", date: "Apr 14", state: "new", freshness: "archived", topic: "Lunar", img: "https://images.unsplash.com/photo-1518365050014-70fe7232897f?w=1400&q=80&auto=format", deck: "PPE goes live. Solar arrays unfurl on the first try — a quiet milestone for cislunar infrastructure.", time: "11d ago" },
];

const ASTRO = [
  { type: "Meteor Shower", glyph: "η", name: "Eta Aquariids", when: "May 6, after midnight", dir: "E", alt: "32°", featured: true },
  { type: "Planet · Tonight", glyph: "♃", name: "Jupiter Rises", when: "May 5, 21:42 local", dir: "SE", alt: "41°" },
  { type: "Planet · Tonight", glyph: "♄", name: "Saturn Visible", when: "May 5, 03:14 local", dir: "S", alt: "18°" },
  { type: "Solstice", glyph: "✷", name: "June Solstice", when: "Jun 21, 04:42 UTC", dir: "—", alt: "—" },
];

const TOPICS = [
  { name: "Starship", count: 22, color: "#e8542c", trend: "+8" },
  { name: "JWST", count: 18, color: "#4ec5cf", trend: "+2" },
  { name: "Mars", count: 14, color: "#d4a64a", trend: "+4" },
  { name: "Lunar", count: 11, color: "#8a6dbf", trend: "−1" },
  { name: "Exoplanets", count: 9, color: "#7eb09b", trend: "+1" },
  { name: "ISS", count: 7, color: "#c97b89", trend: "0" },
];

const lead = ARTICLES[0];
const featured2 = ARTICLES[1];
const featured3 = ARTICLES[2];
const wire = [ARTICLES[3], ARTICLES[4], ARTICLES[2], ARTICLES[1]];

function Header({ active }) {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);
  const dateStr = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  return (
    <>
      <div className="masthead">
        <div className="left">
          <span>Tuesday Edition · No. 0117</span>
          <span style={{ color: "#6b6358" }}>{dateStr}</span>
        </div>
        <div className="right">
          <span className="weather-pill">
            <span className="weather-dot"></span> Brussels · partial overcast · 11°C
          </span>
          <span style={{ color: "#6b6358" }}>Subscribe</span>
        </div>
      </div>
      <div className="brand-bar">
        <div className="brand-meta">
          <div className="row"><strong>2,419</strong> archived signals</div>
          <div className="row">127 fresh in last 48h</div>
        </div>
        <div className="brand">Cosmo<span className="amp">&</span>Brief</div>
        <div className="brand-actions">
          <span className="chip">Search</span>
          <span className="chip">Saved</span>
          <span className="avatar">A</span>
        </div>
      </div>
      <nav className="section-nav">
        {[
          { id: "top", label: "The Edition" },
          { id: "sky", label: "Tonight's Sky" },
          { id: "long", label: "Long Reads" },
          { id: "wire", label: "The Wire" },
          { id: "orbit", label: "Reading Orbit" },
          { id: "wordle", label: "Wordle" },
        ].map(t => (
          <a key={t.id} className={active === t.id ? "active" : ""} onClick={(e) => { e.preventDefault(); const el = document.getElementById(t.id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }}>{t.label}</a>
        ))}
        <span className="spacer"></span>
        <span className="live"><span className="live-dot"></span> Updated 14 minutes ago</span>
      </nav>
    </>
  );
}

function Hero() {
  return (
    <section id="top" className="hero">
      <div className="hero-img"><img src={lead.img} alt={lead.title} /></div>
      <div className="hero-grain"></div>
      <div className="hero-content">
        <div className="hero-kicker"><span className="sep"></span> Lead · {lead.topic} · {lead.site}</div>
        <h1 className="hero-headline">JWST catches a cluster <em>feeding</em> the cosmic web.</h1>
        <p className="hero-deck">The intracluster medium is leaking filaments into surrounding voids — the first direct evidence that the web pulls itself together while it pulls galaxies in.</p>
        <div className="hero-meta">
          <span><strong>{lead.time}</strong></span>
          <span>{lead.site}</span>
          <span>6 min read</span>
          <span className="read-more">Read the brief →</span>
        </div>
      </div>
      <aside className="hero-side">
        <div className="label">Up Next · Tonight</div>
        <div className="what">η-Aquariid meteor shower peaks after midnight.</div>
        <div className="when">May 6 · ~50/hr · clear skies forecast</div>
        <div className="compass">
          <span>Look <strong>E</strong> · 32° above</span>
          <span className="arrow">↗</span>
        </div>
      </aside>
    </section>
  );
}

function SkySection() {
  return (
    <section id="sky" className="section">
      <div className="section-head">
        <div>
          <div className="section-num">§ 01 · The View Tonight</div>
          <h2 className="section-title">A meteor shower, two planets, and the long <em>turn of the year</em>.</h2>
        </div>
        <div className="section-meta">
          <span className="pri">Brussels · 50.85°N</span>
          Change location ↗
        </div>
      </div>
      <div className="sky-strip">
        {ASTRO.map((e, i) => (
          <div key={i} className={"sky-card" + (e.featured ? " featured" : "")}>
            <div className="glyph">{e.glyph}</div>
            <div className="type">{e.type}</div>
            <div className="name">{e.name}</div>
            <div className="when">{e.when}</div>
            <div className="where">
              <span>Look {e.dir !== "—" ? <strong>{e.dir} · {e.alt}</strong> : <strong>Global</strong>}</span>
              <span>+ Cal</span>
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

function FeaturedSection() {
  return (
    <section id="long" className="section">
      <div className="section-head">
        <div>
          <div className="section-num">§ 02 · Long Reads</div>
          <h2 className="section-title">Two stories worth <em>slowing down</em> for.</h2>
        </div>
        <div className="section-meta">
          <span className="pri">Curated by AI</span>
          Adjust tone ↗
        </div>
      </div>
      <div className="feature-grid">
        <div className="feature">
          <div className="img"><img src={featured2.img} alt={featured2.title} /></div>
          <div className="kicker">{featured2.topic} · {featured2.site}</div>
          <h3 className="head">Starship's sixth flight burned through Mach 22 — and the tiles held.</h3>
          <p className="deck">{featured2.deck}</p>
          <div className="meta">
            <span>{featured2.time}</span><span className="dot"></span><span>8 min</span><span className="dot"></span><span style={{ color: "var(--accent)" }}>Read</span>
          </div>
        </div>
        <div className="feature tall">
          <div className="img"><img src={featured3.img} alt={featured3.title} /></div>
          <div className="kicker">{featured3.topic} · {featured3.site}</div>
          <h3 className="head">Europa Clipper finds its first plume.</h3>
          <p className="deck">{featured3.deck}</p>
          <div className="meta">
            <span>{featured3.time}</span><span className="dot"></span><span>5 min</span><span className="dot"></span><span style={{ color: "var(--accent)" }}>Read</span>
          </div>
        </div>
      </div>
    </section>
  );
}

function PullQuote() {
  return (
    <section className="pullquote">
      <div className="mark">"</div>
      <blockquote>The plasma blackout window held for five minutes, and then the telemetry came back <em>perfectly clean</em>.</blockquote>
      <div className="attr">— flight director's note · ascent ops · T+52</div>
    </section>
  );
}

function WireSection() {
  return (
    <section id="wire" className="section">
      <div className="section-head">
        <div>
          <div className="section-num">§ 03 · The Wire</div>
          <h2 className="section-title">Everything else, <em>filed</em>.</h2>
        </div>
        <div className="section-meta">
          <span className="pri">{ARTICLES.length} signals today</span>
          Filter ↗
        </div>
      </div>
      <div className="wire-grid">
        {wire.concat(wire).slice(0, 8).map((a, i) => (
          <div key={i} className="wire-item">
            {a.img ? (
              <div className="wire-thumb"><img src={a.img.replace('w=1400', 'w=240')} alt="" /></div>
            ) : (
              <div className="wire-thumb placeholder">{a.topic.charAt(0)}</div>
            )}
            <div className="wire-body">
              <div className="wire-kicker">
                <span className={"topic " + a.freshness}>● {a.freshness}</span>
                <span>{a.topic}</span>
                <span>·</span>
                <span>{a.site}</span>
              </div>
              <div className="wire-head">{a.title}</div>
              <div className="wire-deck">{a.deck}</div>
            </div>
            <div className="wire-time">{a.time}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function OrbitSection() {
  const total = TOPICS.reduce((s, t) => s + t.count, 0);
  let cumulative = 0;
  const arcs = TOPICS.map(t => {
    const start = (cumulative / total) * 360;
    cumulative += t.count;
    const end = (cumulative / total) * 360;
    return { ...t, start, end };
  });
  const cx = 180, cy = 180, rOuter = 150, rInner = 90;
  const polar = (angle, r) => {
    const a = (angle - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const arcPath = (start, end, rO, rI) => {
    const [x1, y1] = polar(start, rO);
    const [x2, y2] = polar(end, rO);
    const [x3, y3] = polar(end, rI);
    const [x4, y4] = polar(start, rI);
    const large = end - start > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${rO} ${rO} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rI} ${rI} 0 ${large} 0 ${x4} ${y4} Z`;
  };
  return (
    <section id="orbit" className="section">
      <div className="section-head">
        <div>
          <div className="section-num">§ 04 · Reading Orbit</div>
          <h2 className="section-title">The shape of <em>your</em> attention this month.</h2>
        </div>
        <div className="section-meta">
          <span className="pri">81 reads · 6 topics</span>
          See full atlas ↗
        </div>
      </div>
      <div className="orbit-wrap">
        <div className="orbit-svg-wrap">
          <svg width="360" height="360" viewBox="0 0 360 360">
            <defs>
              <radialGradient id="orbit-glow" cx="50%" cy="50%">
                <stop offset="0%" stopColor="rgba(232,84,44,0.18)" />
                <stop offset="100%" stopColor="transparent" />
              </radialGradient>
            </defs>
            <circle cx={cx} cy={cy} r={170} fill="url(#orbit-glow)" />
            {arcs.map((a, i) => (
              <path key={i} d={arcPath(a.start, a.end, rOuter, rInner)} fill={a.color} opacity="0.85">
                <animate attributeName="opacity" values="0.85;1;0.85" dur={`${4 + i * 0.3}s`} repeatCount="indefinite" />
              </path>
            ))}
            <circle cx={cx} cy={cy} r={rInner - 4} fill="var(--ink)" />
            <text x={cx} y={cy - 6} fontFamily="Fraunces, serif" fontStyle="italic" fontWeight="500" fontSize="42" fill="var(--paper)" textAnchor="middle">81</text>
            <text x={cx} y={cy + 22} fontFamily="JetBrains Mono, monospace" fontSize="9" letterSpacing="2" fill="var(--mute)" textAnchor="middle">READS · 30D</text>
          </svg>
        </div>
        <div className="orbit-side">
          {TOPICS.map((t, i) => (
            <div key={i} className="orbit-row">
              <div className="swatch" style={{ background: t.color }}></div>
              <div className="name">{t.name}</div>
              <div className="count">{t.count} reads</div>
              <div className={"trend " + (t.trend.startsWith("+") ? "up" : t.trend === "0" ? "flat" : "down")}>{t.trend}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function WordleSection() {
  const rows = [
    { letters: "ORBIT", states: ["absent", "absent", "absent", "absent", "absent"] },
    { letters: "SPACE", states: ["correct", "absent", "absent", "absent", "present"] },
    { letters: "PLUTO", states: ["correct", "correct", "correct", "correct", "correct"] },
  ];
  return (
    <section id="wordle" className="section">
      <div className="section-head">
        <div>
          <div className="section-num">§ 05 · The Daily Cipher</div>
          <h2 className="section-title">Five letters, six tries, a <em>universe</em> of vocabulary.</h2>
        </div>
        <div className="section-meta">
          <span className="pri">Puzzle #117 · May 5</span>
          Stats ↗
        </div>
      </div>
      <div className="wordle-promo">
        <div className="copy">
          <h3>You solved today's in <em>three</em>.</h3>
          <p>Tomorrow's word ships at 00:00 UTC. Streak holds at twelve — your best is twenty-four.</p>
          <div className="stats">
            <div><strong>117</strong> Played</div>
            <div><strong>92%</strong> Win rate</div>
            <div><strong>12</strong> Streak</div>
            <div><strong>24</strong> Best</div>
          </div>
          <button className="play-btn">Share result →</button>
        </div>
        <div className="wordle-board-mini">
          {rows.map((r, i) => (
            <div key={i} className="wordle-row-mini">
              {r.letters.split("").map((c, j) => (
                <div key={j} className={"w-mini " + r.states[j]}>{c}</div>
              ))}
            </div>
          ))}
          {[0,1,2].map(i => (
            <div key={"e"+i} className="wordle-row-mini">
              {[0,1,2,3,4].map(j => <div key={j} className="w-mini"></div>)}
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="foot">
      <div className="col">
        <div className="brand-foot">Cosmo<span className="amp">&</span>Brief</div>
        <p className="tagline">A daily edition for people who still look up.</p>
      </div>
      <div className="col">
        <h4>Sections</h4>
        <ul><li><a>Tonight's Sky</a></li><li><a>Long Reads</a></li><li><a>The Wire</a></li><li><a>Reading Orbit</a></li></ul>
      </div>
      <div className="col">
        <h4>Account</h4>
        <ul><li><a>Settings</a></li><li><a>Saved articles</a></li><li><a>Themes</a></li><li><a>Sign out</a></li></ul>
      </div>
      <div className="col">
        <h4>Sources</h4>
        <ul><li><a>SNAPI</a></li><li><a>AstronomyAPI</a></li><li><a>OpenStreetMap</a></li><li><a>Method note</a></li></ul>
      </div>
      <div className="foot-bar">
        <span>© 2026 Cosmo Brief · A personal edition</span>
        <span>Stardate 2026.125 · Compiled at 14:42 UTC</span>
      </div>
    </footer>
  );
}

function App() {
  const [active, setActive] = useState("top");
  useEffect(() => {
    const ids = ["top", "sky", "long", "wire", "orbit", "wordle"];
    const els = ids.map(id => document.getElementById(id)).filter(Boolean);
    const obs = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
      if (visible[0]) setActive(visible[0].target.id);
    }, { rootMargin: "-72px 0px -55% 0px", threshold: [0, 0.1, 0.4] });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
  return (
    <>
      <Header active={active} />
      <Hero />
      <SkySection />
      <FeaturedSection />
      <PullQuote />
      <WireSection />
      <OrbitSection />
      <WordleSection />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
